[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "aero-autonomy-ai"
version = "0.1.0"
description = "ResQVision Level 1 flight safety and telemetry anomaly engine."
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "torch>=2.0.0",
    "numpy>=1.24.0",
    "pyyaml>=6.0",
    "tqdm>=4.65.0",
    "onnx>=1.14.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.3.0",
]

[project.scripts]
autonomy = "aero_autonomy_ai.cli:main"

[tool.setuptools.packages.find]
where = ["src"]