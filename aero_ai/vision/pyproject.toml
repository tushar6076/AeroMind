[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "aero-vision-ai"
version = "0.1.0"
description = "ResQVision Level 2 aerial object detection training, evaluation, and ONNX export."
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "torch>=2.0.0",
    "torchvision>=0.15.0",
    "onnx>=1.14.0",
    "pyyaml>=6.0",
    "tqdm>=4.65.0",
    "pillow>=9.5.0",
    "numpy>=1.24.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.3.0",
]

[project.scripts]
vision = "aero_vision_ai.cli:main"

[tool.setuptools.packages.find]
where = ["src"]