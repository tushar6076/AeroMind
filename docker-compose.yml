services:
  api:
    build:
      context: ./aero_cloud
      dockerfile: Dockerfile
    env_file:
      - ./aero_cloud/.env
    environment:
      HOST: 0.0.0.0
      PORT: 8100
      DEBUG: "false"
      ENVIRONMENT: production
    ports:
      - "8100:8100"
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8100/', timeout=3)"
      interval: 30s
      timeout: 5s
      start_period: 20s
      retries: 3
    restart: unless-stopped
