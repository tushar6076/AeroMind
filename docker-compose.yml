services:
  api:
    build:
      context: ./resq_cloud
      dockerfile: Dockerfile
    env_file:
      - ./resq_cloud/.env
    environment:
      HOST: 0.0.0.0
      PORT: 8000
      DEBUG: "false"
      ENVIRONMENT: production
      WORKERS_COUNT: 1
    ports:
      - "127.0.0.1:8000:8000"
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/', timeout=3)"
      interval: 30s
      timeout: 5s
      start_period: 20s
      retries: 3
    restart: unless-stopped

  worker:
    build:
      context: ./resq_cloud
      dockerfile: Dockerfile
    env_file:
      - ./resq_cloud/.env
    command:
      - celery
      - -A
      - app.workers.celery_app:celery_app
      - worker
      - --loglevel=INFO
      - --concurrency=1
    restart: unless-stopped

  cloudflared:
    image: cloudflare/cloudflared:2026.8.3
    command:
      - tunnel
      - --no-autoupdate
      - run
      - --token
      - ${CLOUDFLARE_TUNNEL_TOKEN:?Set CLOUDFLARE_TUNNEL_TOKEN in the root .env file}
    depends_on:
      api:
        condition: service_healthy
    restart: unless-stopped
